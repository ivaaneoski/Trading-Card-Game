apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcg-backend
  namespace: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tcg-backend
  template:
    metadata:
      labels:
        app: tcg-backend
    spec:
      containers:
      - name: tcg-backend
        image: docker-registry/tcg-backend:latest
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: tcg-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: tcg-secrets
              key: redis-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: tcg-secrets
              key: jwt-secret
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: tcg-secrets
              key: aws-access-key
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: tcg-secrets
              key: aws-secret-key
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: tcg-backend
  namespace: production
spec:
  selector:
    app: tcg-backend
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcg-frontend
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tcg-frontend
  template:
    metadata:
      labels:
        app: tcg-frontend
    spec:
      containers:
      - name: tcg-frontend
        image: docker-registry/tcg-frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: tcg-frontend
  namespace: production
spec:
  selector:
    app: tcg-frontend
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
